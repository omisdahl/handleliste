<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Handleliste">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<title>Handleliste</title>
<style>
  :root { --green:#2f7d4f; --bg:#f6f5f1; --card:#fff; --text:#1d1d1b; --muted:#8a8a85; --line:#e6e4de; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151614; --card:#20221f; --text:#ecebe6; --muted:#8d8f88; --line:#30332e; }
  }
  [hidden] { display:none !important; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family:-apple-system, system-ui, sans-serif; background:var(--bg); color:var(--text);
         padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { position:sticky; top:0; background:var(--bg); padding:16px 16px 8px; z-index:2; }
  h1 { margin:0 0 12px; font-size:28px; display:flex; align-items:center; justify-content:space-between; }
  .status { width:10px; height:10px; border-radius:50%; background:#c44; transition:background .3s; }
  .status.on { background:#3c3; }
  form { display:flex; gap:8px; }
  input[type=text] { flex:1; font-size:17px; padding:12px 14px; border-radius:12px; border:1px solid var(--line);
                     background:var(--card); color:var(--text); outline:none; }
  input[type=text]:focus { border-color:var(--green); }
  button { font:inherit; border:0; border-radius:12px; cursor:pointer; }
  .add { background:var(--green); color:#fff; font-size:22px; width:48px; }
  .store { display:flex; gap:8px; margin-bottom:10px; }
  select { flex:1; font-size:16px; padding:10px 12px; border-radius:12px; border:1px solid var(--line);
           background:var(--card); color:var(--text); -webkit-appearance:none; appearance:none; }
  .store button { background:var(--card); border:1px solid var(--line); color:var(--text); padding:0 12px; font-size:14px; }
  .hint { font-size:12px; color:var(--muted); margin:-4px 2px 8px; min-height:1em; }
  li .new { font-size:11px; color:var(--green); border:1px solid var(--green); border-radius:6px; padding:1px 5px; }
  .wrap { position:relative; flex:1; display:flex; }
  .sugg { position:absolute; top:calc(100% + 4px); left:0; right:0; margin:0; padding:4px; z-index:5;
          background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.15); }
  .sugg li { border:0; margin:0; padding:11px 12px; border-radius:8px; cursor:pointer; }
  .sugg li.sel, .sugg li:active { background:var(--bg); }
  .sugg .cat { font-size:12px; color:var(--muted); }
  .sugg .on { font-size:12px; color:var(--green); }
  li.flash { animation:flash 1.2s; }
  @keyframes flash { 0%,60% { background:#ffe58a; } }
  .toast { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%);
           background:#1d1d1b; color:#fff; padding:10px 16px; border-radius:20px; font-size:15px; z-index:9;
           opacity:0; transition:opacity .2s; pointer-events:none; max-width:90vw; text-align:center; }
  .toast.show { opacity:1; }
  ul { list-style:none; margin:0; padding:0 16px; }
  li { display:flex; align-items:center; gap:12px; background:var(--card); border-radius:12px; padding:12px 14px;
       margin-bottom:6px; border:1px solid var(--line); user-select:none; }
  li .box { width:24px; height:24px; border-radius:50%; border:2px solid var(--green); flex:none;
            display:grid; place-items:center; color:#fff; font-size:14px; }
  li.done .box { background:var(--green); }
  li.done .t { text-decoration:line-through; color:var(--muted); }
  li .t { flex:1; font-size:17px; word-break:break-word; }
  li .main { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  li .main .t { flex:none; }
  li .meta { font-size:12px; color:var(--muted); display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  li .catbtn { background:none; padding:0; color:var(--muted); font-size:12px; border-radius:0; }
  li .catbtn.none { color:var(--green); font-weight:600; }
  li .qty { min-width:56px; max-width:90px; padding:7px 8px; border-radius:9px; background:var(--bg); color:var(--text);
            font-size:15px; font-weight:600; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  li .qty.empty { color:var(--muted); font-weight:400; opacity:.55; }
  li.done .qty.empty, li.done .catbtn.none { visibility:hidden; }
  .sugg li.newitem .t { color:var(--green); font-weight:600; }
  .sheet { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:20; display:flex; align-items:flex-end; justify-content:center; }
  .sheet .panel { background:var(--card); width:100%; max-width:520px; border-radius:18px 18px 0 0; padding:18px 16px;
                  padding-bottom:calc(18px + env(safe-area-inset-bottom)); max-height:80vh; overflow:auto; }
  .sheet h3 { margin:0 0 12px; font-size:18px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .chips button { white-space:nowrap; background:var(--bg); color:var(--text); border:1px solid var(--line); padding:10px 14px; font-size:15px; }
  .chips button.cur { background:var(--green); color:#fff; border-color:var(--green); }
  .chips button.add { color:var(--green); border-style:dashed; }
  .sheet .row2 { display:flex; gap:8px; margin-bottom:10px; }
  .sheet input { flex:1; font-size:17px; padding:11px 12px; border-radius:10px; border:1px solid var(--line);
                 background:var(--bg); color:var(--text); }
  .sheet .ok { background:var(--green); color:#fff; padding:0 18px; font-size:16px; }
  .sheet .cancel { width:100%; background:none; color:var(--muted); padding:12px; font-size:15px; }
  li .del { background:none; color:var(--muted); font-size:20px; padding:0 4px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:20px 16px 8px;
       display:flex; justify-content:space-between; align-items:center; }
  .clear { background:none; color:var(--green); font-size:13px; text-transform:none; letter-spacing:0; }
  .empty { text-align:center; color:var(--muted); padding:40px 16px; }
  footer { text-align:center; padding:24px; font-size:13px; color:var(--muted); }
  footer button { background:none; color:var(--muted); text-decoration:underline; font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>Handleliste <span class="status" id="status" title="Sanntid"></span></h1>
  <div class="store">
    <select id="store" aria-label="Butikk"></select>
    <button id="storeMenu" type="button">Butikker…</button>
  </div>
  <p class="hint" id="hint"></p>
  <form id="form" autocomplete="off">
    <div class="wrap">
      <input type="text" id="input" placeholder="Legg til vare…" enterkeyhint="done"
             autocapitalize="sentences" autocorrect="off" spellcheck="false">
      <ul class="sugg" id="sugg" hidden></ul>
    </div>
    <button class="add" aria-label="Legg til">+</button>
  </form>
</header>

<ul id="todo"></ul>
<h2 id="doneHead" hidden>I kurven <button class="clear" id="clear">Tøm</button></h2>
<ul id="done"></ul>
<div class="toast" id="toast"></div>
<div class="sheet" id="sheet" hidden><div class="panel" id="panel"></div></div>
<p class="empty" id="empty" hidden>Lista er tom 🎉</p>

<footer>
  Du er <b id="me"></b> · <button id="rename">bytt navn</button> · <button id="logout">logg ut</button>
</footer>

<script src="/groceries.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let name = localStorage.getItem('hl_name');
function askName() {
  const n = prompt('Hva heter du? (vises på varene du legger til)', name || '');
  if (n !== null && n.trim()) { name = n.trim(); localStorage.setItem('hl_name', name); }
  $('me').textContent = name || 'ukjent';
}
if (!name) askName(); else $('me').textContent = name;

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (r.status === 401) location.href = '/login.html';
  return r;
}

let items = [], stores = [], order = { items: {}, categories: {} };
let storeId = Number(localStorage.getItem('hl_store')) || null;

function renderStores() {
  const sel = $('store');
  if (storeId && !stores.some((s) => s.id === storeId)) storeId = null;
  sel.replaceChildren(new Option('🏠 Ingen butikk (hjemme)', ''),
    ...stores.map((s) => new Option('🛒 ' + s.name, s.id)));
  sel.value = storeId || '';
}
async function loadOrder() {
  order = { items: {}, categories: {} };
  if (storeId) { const r = await api(`/api/stores/${storeId}/order`); if (r.ok) order = await r.json(); }
  render();
}
$('store').onchange = () => {
  storeId = Number($('store').value) || null;
  storeId ? localStorage.setItem('hl_store', storeId) : localStorage.removeItem('hl_store');
  loadOrder();
};
$('storeMenu').onclick = async () => {
  const cur = stores.find((s) => s.id === storeId);
  const a = prompt('Skriv navnet på en ny butikk' + (cur ? `\n(eller skriv SLETT for å fjerne «${cur.name}»)` : ''));
  if (!a || !a.trim()) return;
  if (cur && a.trim().toUpperCase() === 'SLETT') {
    if (confirm(`Slette «${cur.name}» og alt den har lært om rekkefølgen?`))
      await api(`/api/stores/${cur.id}`, { method: 'DELETE' });
    return;
  }
  const r = await api('/api/stores', { method: 'POST', body: JSON.stringify({ name: a.trim() }) });
  if (r.ok) { stores = await r.json(); const s = stores.find((x) => x.name === a.trim());
    if (s) { $('store').value = s.id; $('store').onchange(); } renderStores(); }
};

function render() {
  let todo = items.filter((i) => !i.checked);
  const done = items.filter((i) => i.checked).sort((a, b) => b.checked_at - a.checked_at);
  if (storeId) {
    // Kjente varer etter lært plassering. Nye varer plasseres ved andre varer i samme kategori,
    // og helt ukjente havner nederst.
    const sc = (i) => order.items[i.key]?.score ?? (order.categories[i.cat] ?? 1.5) + 0.001;
    todo = todo.sort((a, b) => sc(a) - sc(b) || a.created_at - b.created_at);
    const known = Object.keys(order.items).length;
    $('hint').textContent = known ? `Sortert etter hvordan dere pleier å gå i butikken (${known} varer lært).`
      : 'Huk av varene i den rekkefølgen du plukker dem, så lærer appen butikken.';
  } else $('hint').textContent = '';
  $('todo').replaceChildren(...todo.map(row));
  $('done').replaceChildren(...done.map(row));
  $('doneHead').hidden = !done.length;
  $('empty').hidden = items.length > 0;
}
function row(i) {
  const li = document.createElement('li');
  if (i.checked) li.className = 'done';
  li.dataset.id = i.id;
  li.innerHTML = `<span class="box"></span>
    <span class="main"><span class="t"></span><span class="meta"><button class="catbtn"></button><span class="by"></span></span></span>
    <button class="qty"></button><button class="del" aria-label="Slett">×</button>`;
  li.querySelector('.box').textContent = i.checked ? '✓' : '';
  li.querySelector('.t').textContent = i.text;
  const cb = li.querySelector('.catbtn');
  cb.textContent = i.cat || '＋ kategori';
  cb.classList.toggle('none', !i.cat);
  li.querySelector('.by').textContent = i.added_by ? '· ' + i.added_by : '';
  const qb = li.querySelector('.qty');
  qb.textContent = i.qty || 'antall';
  qb.classList.toggle('empty', !i.qty);
  if (storeId && !i.checked && !order.items[i.key] && Object.keys(order.items).length) {
    const n = document.createElement('span'); n.className = 'new'; n.textContent = 'ny her';
    li.querySelector('.meta').append(n);
  }
  li.addEventListener('click', async (e) => {
    if (e.target.closest('.del')) return api(`/api/items/${i.id}`, { method: 'DELETE' });
    if (e.target.closest('.qty')) {
      const q = await pickQty(i.text, i.qty);
      if (q !== null) api(`/api/items/${i.id}`, { method: 'PATCH', body: JSON.stringify({ qty: q }) });
      return;
    }
    if (e.target.closest('.catbtn')) {
      const c = await pickCategory(i.text, i.cat);
      if (c) await setCategory(i.text, c);
      return;
    }
    li.classList.toggle('done');
    api(`/api/items/${i.id}/toggle`, { method: 'POST', body: JSON.stringify({ storeId }) });
  });
  return li;
}

// ---------- Ark (bunnpanel) for antall og kategori ----------
let sheetDone = null;
function openSheet(build) {
  closeSheet(null);
  const panel = $('panel'); panel.replaceChildren();
  return new Promise((resolve) => {
    sheetDone = resolve;
    build(panel, (v) => closeSheet(v));
    const cancel = document.createElement('button'); cancel.className = 'cancel'; cancel.textContent = 'Avbryt';
    cancel.onclick = () => closeSheet(null);
    panel.append(cancel);
    $('sheet').hidden = false;
  });
}
function closeSheet(v) {
  $('sheet').hidden = true;
  if (sheetDone) { const d = sheetDone; sheetDone = null; d(v); }
}
$('sheet').addEventListener('click', (e) => { if (e.target === $('sheet')) closeSheet(null); });
const el = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids); return n; };

function pickQty(itemName, current) {
  return openSheet((p, done) => {
    p.append(el('h3', { textContent: `Antall – ${itemName}` }));
    const chips = el('div', { className: 'chips' });
    for (const n of ['1', '2', '3', '4', '5', '6']) {
      chips.append(el('button', { textContent: n, className: current === n ? 'cur' : '', onclick: () => done(n) }));
    }
    p.append(chips);
    const inp = el('input', { type: 'text', value: current || '', placeholder: 'F.eks. 400 g, 2 pk, 1,5 l' });
    const form = el('form', { className: 'row2', onsubmit: (e) => { e.preventDefault(); done(inp.value.trim()); } },
      inp, el('button', { className: 'ok', textContent: 'Lagre' }));
    p.append(form);
    if (current) p.append(el('button', { className: 'cancel', textContent: 'Fjern antall', onclick: () => done('') }));
  });
}

let categories = Groceries.CATEGORIES.slice();
async function loadCategories() {
  const r = await api('/api/categories');
  if (r.ok) categories = await r.json();
}
function pickCategory(itemName, current) {
  return openSheet((p, done) => {
    p.append(el('h3', { textContent: `Kategori – ${itemName}` }));
    const chips = el('div', { className: 'chips' });
    for (const c of categories) chips.append(el('button', { textContent: c, className: c === current ? 'cur' : '', onclick: () => done(c) }));
    chips.append(el('button', { className: 'add', textContent: '＋ Ny kategori', onclick: () => {
      const n = prompt('Navn på ny kategori');
      if (n && n.trim()) done(n.trim());
    } }));
    p.append(chips);
  });
}
async function setCategory(text, cat) {
  const r = await api('/api/categories', { method: 'PUT', body: JSON.stringify({ text, cat }) });
  if (r.ok) categories = await r.json();
  loadSuggestions();
}

async function addText(text, extra = {}) {
  text = text.trim();
  if (!text) return;
  $('input').value = ''; hideSugg();
  const r = await api('/api/items', { method: 'POST', body: JSON.stringify({ text, addedBy: name, ...extra }) });
  const res = await r.json().catch(() => ({}));
  if (res.duplicate) {
    toast(`«${res.text}» står allerede på lista`);
    const li = document.querySelector(`li[data-id="${res.duplicate}"]`);
    if (li) { li.scrollIntoView({ block: 'center', behavior: 'smooth' }); li.classList.remove('flash'); void li.offsetWidth; li.classList.add('flash'); }
  }
  loadSuggestions();
}
$('form').addEventListener('submit', (e) => {
  e.preventDefault();
  const hit = sel >= 0 ? shown[sel] : null;
  if (hit) pickSuggestion(hit); else addText($('input').value);
  $('input').focus();
});
let tt;
function toast(msg) {
  $('toast').textContent = msg; $('toast').classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => $('toast').classList.remove('show'), 2500);
}

// ---------- Forslag: katalog + familiens egne varer, tåler skrivefeil ----------
let entries = Groceries.CATALOG.map((e) => ({ ...e, n: 0 }));
let shown = [], sel = -1;
async function loadSuggestions() {
  const r = await api('/api/suggestions');
  if (!r.ok) return;
  const hist = await r.json();
  const byKey = new Map(Groceries.CATALOG.map((e) => [e.key, { ...e, n: 0 }]));
  for (const h of hist) {
    if (byKey.has(h.key)) Object.assign(byKey.get(h.key), { n: h.n, cat: h.cat || byKey.get(h.key).cat });
    else byKey.set(h.key, { name: h.text, cat: h.cat, key: h.key, terms: [Groceries.norm(h.text)], n: h.n });
  }
  entries = [...byKey.values()];
}
function hideSugg() { $('sugg').hidden = true; shown = []; sel = -1; }
// Velg et forslag: tar med antall hvis det ble skrevet ("2 bannaer" -> Bananer, antall 2)
async function pickSuggestion(e) {
  const { qty } = Groceries.splitQty($('input').value);
  if (e.isNew) {
    const name = e.name;
    hideSugg(); $('input').blur();
    const cat = await pickCategory(name, null);
    if (cat === null) { $('input').value = $('input').value || name; return; }
    await addText(name, { qty, cat });
    loadCategories();
  } else addText(e.name, { qty });
}
function showSugg() {
  const raw = $('input').value;
  const { name: typed } = Groceries.splitQty(raw);
  shown = typed.trim() ? Groceries.search(raw, entries, 6) : [];
  // Ingen eksakt treff? Tilby å legge den til som ny varetype med kategori
  const k = Groceries.keyOf(typed);
  const nq = Groceries.norm(typed);
  const prefixHit = shown.some((e) => e.terms.some((t) => t.startsWith(nq)));
  if (typed.trim().length >= 2 && !entries.some((e) => e.key === k) && !prefixHit) {
    shown = shown.slice(0, 5);
    const cap = typed.trim().charAt(0).toLocaleUpperCase('nb') + typed.trim().slice(1);
    shown.push({ name: cap, isNew: true, key: k });
  }
  sel = -1;
  if (!shown.length) return hideSugg();
  const onList = new Set(items.filter((i) => !i.checked).map((i) => i.key));
  $('sugg').replaceChildren(...shown.map((e) => {
    const li = document.createElement('li');
    const t = document.createElement('span'); t.className = 't';
    const c = document.createElement('span');
    if (e.isNew) { li.className = 'newitem'; t.textContent = `＋ Legg til «${e.name}»`; c.className = 'cat'; c.textContent = 'ny vare – velg kategori'; }
    else {
      t.textContent = e.name;
      if (onList.has(e.key)) { c.className = 'on'; c.textContent = '✓ på lista'; }
      else { c.className = 'cat'; c.textContent = e.cat || (e.n ? 'brukt før' : ''); }
    }
    li.append(t, c);
    // pointerdown (ikke click), så tastaturet ikke lukkes før vi rekker å legge til
    li.addEventListener('pointerdown', (ev) => { ev.preventDefault(); pickSuggestion(e); });
    return li;
  }));
  $('sugg').hidden = false;
}
$('input').addEventListener('input', showSugg);
$('input').addEventListener('blur', () => setTimeout(hideSugg, 150));
$('input').addEventListener('keydown', (e) => {
  if (!shown.length || !['ArrowDown', 'ArrowUp', 'Escape'].includes(e.key)) return;
  e.preventDefault();
  if (e.key === 'Escape') return hideSugg();
  if (e.key === 'ArrowDown') sel = sel + 1 >= shown.length ? -1 : sel + 1;
  else sel = sel - 1 < -1 ? shown.length - 1 : sel - 1;
  [...$('sugg').children].forEach((li, i) => li.classList.toggle('sel', i === sel));
});
$('clear').onclick = () => { if (confirm('Fjerne alle varer i kurven?')) api('/api/clear-checked', { method: 'POST' }); };
$('rename').onclick = askName;
$('logout').onclick = async () => { await api('/api/logout', { method: 'POST' }); location.href = '/login.html'; };


// Sanntid: Server-Sent Events, kobler til på nytt automatisk
let es;
function connect() {
  es?.close();
  es = new EventSource('/api/events');
  es.onopen = () => $('status').classList.add('on');
  es.onmessage = (e) => { items = JSON.parse(e.data); storeId ? loadOrder() : render(); };
  es.addEventListener('stores', (e) => { stores = JSON.parse(e.data); renderStores(); });
  es.onerror = () => { $('status').classList.remove('on'); };
}
api('/api/stores').then((r) => r.json()).then((s) => { stores = s; renderStores(); loadOrder(); });
connect();
loadSuggestions();
loadCategories();
// iOS dreper tilkoblingen når appen går i bakgrunnen – koble til på nytt når den vises igjen
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && es.readyState !== EventSource.OPEN) connect();
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
</script>
</body>
</html>
